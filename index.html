<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#213c32" />
    <meta name="description" content="Seu café favorito, no seu ritmo. Escolha entre 14 cafés e experimente o fluxo de compra fictício do Coffee Delivery." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Coffee Delivery — café no seu ritmo</title>
    <script>try{const t=localStorage.getItem('coffee:theme');document.documentElement.dataset.theme=t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}catch{}</script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
